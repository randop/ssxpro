[workspace]
resolver = "2"
members = [
    "crates/ssxpro-proto",
    "crates/ssxpro-crypto",
    "crates/ssxpro-io",
    "crates/ssxpro-config",
    "crates/ssxpro-compression",
    "crates/ssxpro-server",
    "crates/ssxpro-client",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
yaml_serde = "=0.10.7"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
io-uring = "=0.7.15"
boring = "=4.22.0"
base64 = "0.22"
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
