
stages:
  - build

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cache/cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"
  CARGO_TERM_COLOR: "always"

# Keep caches separate because each job uses a different target/toolchain.
cache:
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/cargo/registry/
    - .cache/cargo/git/
    - target/

# Native x86_64 GNU build
build:x86_64:
  stage: build
  image: rust:1-trixie
  variables:
    LIBCLANG_PATH: /usr/lib/llvm-19/lib
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      build-essential cmake perl pkg-config libclang-dev
    - rm -rf /var/lib/apt/lists/*
  script:
    - cargo build --release
  artifacts:
    name: "ssxpro-x86_64-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/release/ssx
      - target/release/ssxd
    expire_in: 1 week

# x86_64 static musl build
build:x86_64-musl:
  stage: build
  image:
    name: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl
    entrypoint: [""]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends perl
    - rm -rf /var/lib/apt/lists/*
  script:
    - cargo build --release --target x86_64-unknown-linux-musl
    # Verify static binaries.
    - |
      for binary in ssx ssxd; do
        path="target/x86_64-unknown-linux-musl/release/$binary"
        if readelf -l "$path" | grep -q 'INTERP'; then
          echo "Expected a static binary, but $path has an ELF interpreter" >&2
          exit 1
        fi
      done
  artifacts:
    name: "ssxpro-x86_64-musl-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/x86_64-unknown-linux-musl/release/ssx
      - target/x86_64-unknown-linux-musl/release/ssxd
    expire_in: 1 week

# ARMHF (32-bit ARM hard-float) cross-compilation
build:armhf:
  stage: build
  image: rust:1-trixie
  variables:
    LIBCLANG_PATH: /usr/lib/llvm-19/lib
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends
      build-essential cmake perl pkg-config libclang-dev
      gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
      binutils-arm-linux-gnueabihf libc6-dev-armhf-cross
    - rm -rf /var/lib/apt/lists/*
    - rustup target add armv7-unknown-linux-gnueabihf
    - mkdir -p "$CI_PROJECT_DIR/target"
    - |
      cat > "$CI_PROJECT_DIR/target/armhf-toolchain.cmake" <<'CMAKE'
      set(CMAKE_SYSTEM_NAME Linux)
      set(CMAKE_SYSTEM_PROCESSOR arm)
      set(CMAKE_SYSROOT /usr/arm-linux-gnueabihf)
      set(CMAKE_C_COMPILER arm-linux-gnueabihf-gcc)
      set(CMAKE_CXX_COMPILER arm-linux-gnueabihf-g++)
      set(CMAKE_ASM_COMPILER arm-linux-gnueabihf-gcc)
      set(CMAKE_AR arm-linux-gnueabihf-ar)
      set(CMAKE_RANLIB arm-linux-gnueabihf-ranlib)
      set(CMAKE_FIND_ROOT_PATH /usr/arm-linux-gnueabihf)
      set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
      set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
      set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
      set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
      set(CMAKE_C_FLAGS "-ffunction-sections -fdata-sections -fPIC -march=armv7-a -mfpu=vfpv3-d16")
      set(CMAKE_CXX_FLAGS "-ffunction-sections -fdata-sections -fPIC -march=armv7-a -mfpu=vfpv3-d16")
      set(CMAKE_ASM_FLAGS "-ffunction-sections -fdata-sections -fPIC -march=armv7-a -mfpu=vfpv3-d16")
      CMAKE
    - export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
    - export CC_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-gcc
    - export CXX_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-g++
    - export AR_armv7_unknown_linux_gnueabihf=arm-linux-gnueabihf-ar
    - export CMAKE_TOOLCHAIN_FILE_armv7_unknown_linux_gnueabihf="$CI_PROJECT_DIR/target/armhf-toolchain.cmake"
    - export BINDGEN_EXTRA_CLANG_ARGS_armv7_unknown_linux_gnueabihf="--sysroot=/usr/arm-linux-gnueabihf -idirafter/usr/include"
  script:
    - cargo build --release --target armv7-unknown-linux-gnueabihf
  artifacts:
    name: "ssxpro-armhf-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/armv7-unknown-linux-gnueabihf/release/ssx
      - target/armv7-unknown-linux-gnueabihf/release/ssxd
    expire_in: 1 week

# ARM64 (AArch64) cross-compilation
