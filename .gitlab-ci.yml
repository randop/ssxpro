    - >-
      apt-get install -y --no-install-recommends
      build-essential cmake perl pkg-config libclang-dev
      gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      binutils-aarch64-linux-gnu libc6-dev-arm64-cross
    - rm -rf /var/lib/apt/lists/*
    - rustup target add aarch64-unknown-linux-gnu
    - mkdir -p "$CI_PROJECT_DIR/target"
    - |
      cat > "$CI_PROJECT_DIR/target/arm64-toolchain.cmake" <<'CMAKE'
      set(CMAKE_SYSTEM_NAME Linux)
      set(CMAKE_SYSTEM_PROCESSOR aarch64)
      set(CMAKE_SYSROOT /usr/aarch64-linux-gnu)
      set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
      set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
      set(CMAKE_ASM_COMPILER aarch64-linux-gnu-gcc)
      set(CMAKE_AR aarch64-linux-gnu-ar)
      set(CMAKE_RANLIB aarch64-linux-gnu-ranlib)
      set(CMAKE_FIND_ROOT_PATH /usr/aarch64-linux-gnu)
      set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
      set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
      set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
      set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
      set(CMAKE_C_FLAGS "-ffunction-sections -fdata-sections -fPIC")
      set(CMAKE_CXX_FLAGS "-ffunction-sections -fdata-sections -fPIC")
      set(CMAKE_ASM_FLAGS "-ffunction-sections -fdata-sections -fPIC")
      CMAKE
    - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
    - export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
    - export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
    - export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
