  artifacts:
    name: "ssxpro-arm64-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/aarch64-unknown-linux-gnu/release/ssx
      - target/aarch64-unknown-linux-gnu/release/ssxd
    expire_in: 1 week

