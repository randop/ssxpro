listen: "0.0.0.0:2222"
host_key: "/etc/ssx/host_ed25519"
workers: 1
io:
  ring_entries: 4096
  recv_buffers: 2048
  buffer_size: 2048
  hugepages: false
  gro: true
  gso: true
  zerocopy_send: false
  zerocopy_min_bytes: 16384
  sqpoll: false
  sqpoll_idle_ms: 2
  napi_busy_poll_us: 0
  txtime_pacing: false
  pin_cpus: true
  restrict_ring: true
quic:
  idle_timeout_secs: 600
  keep_alive_interval_secs: 15
  max_connections: 4096
  max_datagram_size: 1200
  retry: true
proto:
  max_control_frame_bytes: 4096
  hello_grace_secs: 5
  auth_timeout_secs: 30
auth:
  # Server-wide key list, checked before the per-user file. Absolute path;
  # a missing file is skipped. A key listed here authorizes that key for any
  # local account (subject to allow_root and the account shell policy), so
  # keep the file root-owned with mode 0600.
  server_authorized_keys: "/etc/ssx/authorized_keys"
  # Per-user key file name inside ~USER/.ssx, checked second.
  authorized_keys: authorized_keys
  max_attempts: 1
  allow_root: false
features:
  iopf_buf_ring: false      # Linux 6.12+ incremental provided-buffer ring
  reuseport_steering: false # requires CAP_BPF capability
  hugepages: false         # hugepages support
session:
  login_grace_secs: 10
  max_sessions: 1024
  max_rows: 500
  max_columns: 500
  shell_path: "/bin/sh"
log:
  level: "info"
  json: false
